[package]
name = "logscope"
version = "0.1.0"
edition = "2021"
description = "Automatic log pattern analysis platform: template extraction, anomaly detection, root-cause clues"

[[bin]]
name = "logscope"
path = "src/main.rs"

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3

[dependencies]
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal", "io-util"] }
axum = "0.8"
tower-http = { version = "0.6", features = ["fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4.6", features = ["derive"] }
parking_lot = "0.12"
ahash = { version = "0.8", features = ["serde"] }
smallvec = { version = "1.16", features = ["serde", "union"] }
